<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Update Data SPG&BA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container" id="formBox">
        <h2>Update Data SPG&BA GUARDIAN</h2>
        <div style="text-align: center; margin-bottom: 20px;">Aplikasi digunakan untuk update data SPG&BA Guardian Indonesia</div>
        <hr>
        <p style="color: #f8ab03;">.</p>
        <form id="storeForm">
            <div class="input-group">
                <label for="toko">Store Saat ini:</label>
                <input type="text" id="toko" name="toko" readonly required>
            </div>

            <div class="input-group">
                <label for="brand">Brand-ID:</label>
                <input type="text" id="brand" name="brand" placeholder="Masukkan nama Brand" required readonly>
            </div>

            <div class="input-group">
                <label for="nama">*Nama SPG&BA: (Bisa Edit)</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama Lengkap Anda" required>
            </div>

            <div class="input-group">
                <label for="email">*Alamat Email: (Bisa Edit)</label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
            </div>

            <div class="input-group">
                <label for="jenis">*Update</label>
                <select id="jenis" name="jenis" required>
                    <option value="" disabled selected>-- Pilih Update --</option>
                    <option value="Yes">Ada Perubahan Data</option>
                    <option value="No">Tidak Ada Perubahan Data</option>
                    <option value="Delete">Delete: Pindah Toko/Perubahan Status (Stay/Mobile)</option>
                </select>
            </div>

            <button type="submit" id="btnSubmit">Submit Data</button>
        </form>
        
        <div id="responseMessage" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
